<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — Quanment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="nav-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Quan<span>ment</span></div>

    <h2 class="auth-title">Create an account</h2>
    <p class="auth-sub">Start converting and calculating quantities</p>

    <form id="register-form" class="stack">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="username" type="text" placeholder="choose a username" autocomplete="username" required minlength="3">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="password" type="password" placeholder="min 6 characters" autocomplete="new-password" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input class="form-input" id="confirm" type="password" placeholder="repeat password" required>
      </div>

      <div id="strength-bar" style="height:3px;border-radius:2px;background:var(--border2);overflow:hidden;margin-top:-.25rem">
        <div id="strength-fill" style="height:100%;width:0;transition:width .3s,background .3s;border-radius:2px"></div>
      </div>
      <p id="strength-text" style="font-size:.75rem;color:var(--muted)"></p>

      <div style="margin-top:.25rem">
        <button class="btn btn-primary btn-full btn-lg" id="reg-btn" type="submit">
          Create account
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Already have an account? <a class="auth-link" href="login.html">Sign in</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="app.js"></script>
<script>
  document.getElementById('nav-root').innerHTML = renderNav('');

  if (isLoggedIn()) window.location.href = 'index.html';

  const pw = document.getElementById('password');
  pw.addEventListener('input', () => {
    const v = pw.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^a-zA-Z0-9]/.test(v)) score++;
    const pct = (score / 5) * 100;
    const colors = ['#ff6b6b','#ff6b6b','#fbbf24','#fbbf24','#3ecf8e','#3ecf8e'];
    const labels = ['','Weak','Weak','Fair','Good','Strong'];
    document.getElementById('strength-fill').style.width = pct + '%';
    document.getElementById('strength-fill').style.background = colors[score] || 'var(--border2)';
    document.getElementById('strength-text').textContent = v.length ? labels[score] : '';
  });

  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    if (password !== confirm) { toast('Passwords do not match', 'error'); return; }

    btn.disabled = true; btn.textContent = 'Creating account…';

    try {
      await apiFetch('/auth/register', 'POST', { username, password });
      toast('Account created! Signing you in…', 'success');

      const data = await apiFetch('/auth/login', 'POST', { username, password });
      if (data && data.token) {
        setAuth(data.token, username);
        setTimeout(() => window.location.href = 'index.html', 800);
      }
    } catch (err) {
      toast(err.message || 'Registration failed', 'error');
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
