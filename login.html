<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Quanment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="nav-root"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Quan<span>ment</span></div>

    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Sign in to your account to continue</p>

    <form id="login-form" class="stack">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="username" type="text" placeholder="your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div style="margin-top:.25rem">
        <button class="btn btn-primary btn-full btn-lg" id="login-btn" type="submit">
          Sign in
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Don't have an account? <a class="auth-link" href="register.html">Create one</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="app.js"></script>
<script>
  document.getElementById('nav-root').innerHTML = renderNav('');

  if (isLoggedIn()) window.location.href = 'index.html';

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const data = await apiFetch('/auth/login', 'POST', { username, password });
      if (data && data.token) {
        setAuth(data.token, username);
        toast('Welcome back, ' + username + '!', 'success');
        setTimeout(() => window.location.href = 'index.html', 700);
      }
    } catch (err) {
      toast(err.message || 'Invalid credentials', 'error');
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
